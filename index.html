<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Humanize — Make Emails Sound Real</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #f0f0f0;
      min-height: 100vh;
      padding: 24px 16px 60px;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
      padding-top: 20px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #ffffff;
    }

    header p {
      margin-top: 8px;
      color: #888;
      font-size: 0.95rem;
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #666;
      margin-bottom: 10px;
    }

    textarea {
      width: 100%;
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      color: #f0f0f0;
      font-size: 0.95rem;
      line-height: 1.6;
      padding: 14px;
      resize: vertical;
      min-height: 180px;
      font-family: inherit;
      transition: border-color 0.2s;
    }

    textarea:focus {
      outline: none;
      border-color: #444;
    }

    textarea::placeholder {
      color: #444;
    }

    .btn {
      width: 100%;
      padding: 16px;
      background: #ffffff;
      color: #000000;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 16px;
      letter-spacing: -0.2px;
    }

    .btn:hover {
      background: #e0e0e0;
    }

    .btn:active {
      transform: scale(0.99);
    }

    .btn:disabled {
      background: #333;
      color: #666;
      cursor: not-allowed;
      transform: none;
    }

    .loading-wrap {
      text-align: center;
      padding: 32px 0;
      display: none;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #2a2a2a;
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 14px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-wrap p {
      color: #666;
      font-size: 0.9rem;
    }

    .results {
      display: none;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .result-text {
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 16px;
      font-size: 0.95rem;
      line-height: 1.7;
      white-space: pre-wrap;
      color: #e8e8e8;
    }

    .copy-btn {
      background: #2a2a2a;
      color: #ccc;
      border: none;
      border-radius: 7px;
      padding: 7px 14px;
      font-size: 0.8rem;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s;
    }

    .copy-btn:hover {
      background: #333;
      color: #fff;
    }

    .copy-btn.copied {
      background: #1a3a1a;
      color: #4caf50;
    }

    .changes-list {
      list-style: none;
      padding: 0;
    }

    .changes-list li {
      padding: 10px 0;
      border-bottom: 1px solid #222;
      font-size: 0.9rem;
      color: #aaa;
      line-height: 1.5;
      padding-left: 20px;
      position: relative;
    }

    .changes-list li:last-child {
      border-bottom: none;
    }

    .changes-list li::before {
      content: '→';
      position: absolute;
      left: 0;
      color: #555;
    }

    .error-box {
      background: #1a0a0a;
      border: 1px solid #3a1a1a;
      border-radius: 10px;
      padding: 16px;
      color: #f08080;
      font-size: 0.9rem;
      display: none;
      margin-top: 16px;
    }

    .reset-btn {
      background: transparent;
      border: 1px solid #2a2a2a;
      color: #666;
      border-radius: 10px;
      padding: 12px;
      width: 100%;
      font-size: 0.9rem;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
      margin-top: 12px;
    }

    .reset-btn:hover {
      border-color: #444;
      color: #999;
    }

    @media (max-width: 480px) {
      header h1 {
        font-size: 1.6rem;
      }
      .card {
        padding: 18px;
      }
    }
  </style>
</head>
<body>

  <div class="container">

    <header>
      <h1>✉️ Humanize</h1>
      <p>Paste your AI email. Get back something that sounds like a real person.</p>
    </header>

    <!-- Input card -->
    <div class="card" id="inputCard">
      <label>Your AI-written email</label>
      <textarea id="inputText" placeholder="Paste your email here — AI-written, too formal, too polished, doesn't matter..."></textarea>
      <div class="error-box" id="errorBox"></div>
      <button class="btn" id="humanizeBtn" onclick="humanize()">Humanize it</button>
    </div>

    <!-- Loading -->
    <div class="loading-wrap" id="loadingWrap">
      <div class="spinner"></div>
      <p>Making it sound human...</p>
    </div>

    <!-- Results -->
    <div class="results" id="results">

      <div class="card">
        <div class="result-header">
          <label style="margin-bottom:0">Humanized version</label>
          <button class="copy-btn" id="copyBtn" onclick="copyText()">Copy</button>
        </div>
        <div class="result-text" id="rewrittenText"></div>
      </div>

      <div class="card">
        <label>What changed & why</label>
        <ul class="changes-list" id="changesList"></ul>
      </div>

      <button class="reset-btn" onclick="reset()">← Start over</button>

    </div>

  </div>

  <script>
    async function humanize() {
      const text = document.getElementById('inputText').value.trim();
      const errorBox = document.getElementById('errorBox');
      const btn = document.getElementById('humanizeBtn');

      errorBox.style.display = 'none';

      if (!text) {
        errorBox.textContent = 'Please paste some text first.';
        errorBox.style.display = 'block';
        return;
      }

      if (text.length < 30) {
        errorBox.textContent = 'That\'s pretty short — paste a full email for best results.';
        errorBox.style.display = 'block';
        return;
      }

      // Show loading
      btn.disabled = true;
      btn.textContent = 'Humanizing...';
      document.getElementById('loadingWrap').style.display = 'block';
      document.getElementById('results').style.display = 'none';

      try {
        const response = await fetch('/api/humanize', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Something went wrong');
        }

        // Show results
        document.getElementById('rewrittenText').textContent = data.rewritten;

        const changesList = document.getElementById('changesList');
        changesList.innerHTML = '';

        const lines = data.changes.split('\n').filter(l => l.trim().length > 0);
        lines.forEach(line => {
          const li = document.createElement('li');
          // Clean up bullet characters if Claude added them
          li.textContent = line.replace(/^[-•*]\s*/, '').trim();
          changesList.appendChild(li);
        });

        document.getElementById('loadingWrap').style.display = 'none';
        document.getElementById('results').style.display = 'block';
        document.getElementById('results').scrollIntoView({ behavior: 'smooth', block: 'start' });

      } catch (err) {
        document.getElementById('loadingWrap').style.display = 'none';
        errorBox.textContent = '⚠️ Error: ' + err.message;
        errorBox.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Humanize it';
      }
    }

    function copyText() {
      const text = document.getElementById('rewrittenText').textContent;
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = 'Copy';
          btn.classList.remove('copied');
        }, 2000);
      });
    }

    function reset() {
      document.getElementById('results').style.display = 'none';
      document.getElementById('inputText').value = '';
      const btn = document.getElementById('humanizeBtn');
      btn.disabled = false;
      btn.textContent = 'Humanize it';
      document.getElementById('errorBox').style.display = 'none';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>

</body>
</html>
