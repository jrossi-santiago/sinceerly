<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Humanize</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0ede8;
      color: #1a1a1a;
      min-height: 100vh;
      padding: 32px 16px 80px;
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 36px;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #1a1a1a;
      letter-spacing: -0.5px;
    }

    header p {
      margin-top: 6px;
      color: #888;
      font-size: 0.9rem;
    }

    .card {
      background: #ffffff;
      border-radius: 20px;
      padding: 28px;
      margin-bottom: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }

    /* SLIDER */
    .slider-section {
      margin-bottom: 24px;
    }

    .slider-labels {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .slider-labels span {
      font-size: 0.85rem;
      font-weight: 600;
      color: #999;
      transition: color 0.2s;
    }

    .slider-labels span.active {
      color: #1a1a1a;
    }

    .slider-track {
      position: relative;
      height: 6px;
      background: #e0dbd4;
      border-radius: 99px;
      cursor: pointer;
    }

    .slider-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      background: #1a1a1a;
      border-radius: 99px;
      transition: width 0.15s;
      pointer-events: none;
    }

    .slider-thumb {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 22px;
      height: 22px;
      background: #1a1a1a;
      border-radius: 50%;
      cursor: grab;
      transition: left 0.15s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }

    .slider-thumb:active { cursor: grabbing; }

    /* MODE BADGE */
    .mode-badge {
      display: inline-block;
      margin-top: 12px;
      padding: 5px 14px;
      border-radius: 99px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      transition: all 0.2s;
    }

    .mode-badge.subtle  { background: #f0ede8; color: #888; }
    .mode-badge.human   { background: #fff3cd; color: #7a5f00; }
    .mode-badge.ceo     { background: #1a1a1a; color: #fff; }

    /* TEXTAREA */
    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #aaa;
      margin-bottom: 10px;
    }

    textarea {
      width: 100%;
      background: #faf9f7;
      border: 1.5px solid #e8e4df;
      border-radius: 12px;
      color: #1a1a1a;
      font-size: 0.95rem;
      line-height: 1.65;
      padding: 14px;
      resize: vertical;
      min-height: 160px;
      font-family: inherit;
      transition: border-color 0.2s;
    }

    textarea:focus {
      outline: none;
      border-color: #bbb;
    }

    textarea::placeholder { color: #bbb; }

    .btn {
      width: 100%;
      padding: 15px;
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 14px;
      font-family: inherit;
      transition: background 0.2s, transform 0.1s;
    }

    .btn:hover { background: #333; }
    .btn:active { transform: scale(0.99); }
    .btn:disabled { background: #ccc; cursor: not-allowed; transform: none; }

    /* LOADING */
    .loading-wrap {
      text-align: center;
      padding: 36px 0;
      display: none;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #e0dbd4;
      border-top-color: #1a1a1a;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 12px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-wrap p { color: #aaa; font-size: 0.88rem; }

    /* RESULTS */
    .results { display: none; }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* Highlighted output */
    .result-text {
      background: #faf9f7;
      border: 1.5px solid #e8e4df;
      border-radius: 12px;
      padding: 16px;
      font-size: 0.95rem;
      line-height: 1.75;
      color: #1a1a1a;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Yellow highlight for changed words */
    .highlight {
      background: #ffe566;
      border-radius: 3px;
      padding: 1px 2px;
    }

    /* Darker orange highlight for CEO mode */
    .highlight-ceo {
      background: #ffb347;
      border-radius: 3px;
      padding: 1px 2px;
    }

    .copy-btn {
      background: #f0ede8;
      color: #555;
      border: none;
      border-radius: 8px;
      padding: 7px 14px;
      font-size: 0.8rem;
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
      transition: background 0.2s;
    }

    .copy-btn:hover { background: #e0dbd4; }
    .copy-btn.copied { background: #d4edda; color: #2d7a3a; }

    /* iPhone footer */
    .iphone-footer {
      font-size: 0.82rem;
      color: #bbb;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #f0ede8;
      display: none;
    }

    /* Changes */
    .changes-list {
      list-style: none;
      padding: 0;
    }

    .changes-list li {
      padding: 9px 0 9px 20px;
      border-bottom: 1px solid #f0ede8;
      font-size: 0.875rem;
      color: #777;
      line-height: 1.5;
      position: relative;
    }

    .changes-list li:last-child { border-bottom: none; }

    .changes-list li::before {
      content: '→';
      position: absolute;
      left: 0;
      color: #ccc;
    }

    /* Error */
    .error-box {
      background: #fff0f0;
      border: 1px solid #ffd0d0;
      border-radius: 10px;
      padding: 14px;
      color: #c0392b;
      font-size: 0.88rem;
      display: none;
      margin-top: 12px;
    }

    .reset-btn {
      background: transparent;
      border: 1.5px solid #e8e4df;
      color: #aaa;
      border-radius: 12px;
      padding: 12px;
      width: 100%;
      font-size: 0.88rem;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
      margin-top: 10px;
    }

    .reset-btn:hover { border-color: #bbb; color: #666; }

    @media (max-width: 480px) {
      header h1 { font-size: 1.5rem; }
      .card { padding: 20px; }
    }
  </style>
</head>
<body>

<div class="container">

  <header>
    <h1>✉️ Humanize</h1>
    <p>Make AI emails sound real.</p>
  </header>

  <!-- Input card -->
  <div class="card">

    <!-- Slider -->
    <div class="slider-section">
      <div class="slider-labels">
        <span id="label-subtle">Subtle</span>
        <span id="label-human">Human</span>
        <span id="label-ceo">CEO</span>
      </div>
      <div class="slider-track" id="sliderTrack">
        <div class="slider-fill" id="sliderFill"></div>
        <div class="slider-thumb" id="sliderThumb"></div>
      </div>
      <div>
        <span class="mode-badge subtle" id="modeBadge">Subtle</span>
      </div>
    </div>

    <label>Your AI-written email</label>
    <textarea id="inputText" placeholder="Paste your AI email here..."></textarea>
    <div class="error-box" id="errorBox"></div>
    <button class="btn" id="humanizeBtn" onclick="humanize()">Humanize it →</button>

  </div>

  <!-- Loading -->
  <div class="loading-wrap" id="loadingWrap">
    <div class="spinner"></div>
    <p id="loadingMsg">Making it sound human...</p>
  </div>

  <!-- Results -->
  <div class="results" id="results">

    <div class="card">
      <div class="result-header">
        <label style="margin-bottom:0">Humanized</label>
        <button class="copy-btn" id="copyBtn" onclick="copyText()">Copy</button>
      </div>
      <div class="result-text" id="rewrittenText"></div>
      <div class="iphone-footer" id="iphoneFooter">Sent from my iPhone</div>
    </div>

    <div class="card">
      <label>What changed</label>
      <ul class="changes-list" id="changesList"></ul>
    </div>

    <button class="reset-btn" onclick="reset()">← Start over</button>

  </div>

</div>

<script>
  // ── SLIDER ──────────────────────────────────────────
  const track = document.getElementById('sliderTrack');
  const thumb = document.getElementById('sliderThumb');
  const fill  = document.getElementById('sliderFill');
  const badge = document.getElementById('modeBadge');

  // 0 = subtle, 0.5 = human, 1 = ceo
  let sliderValue = 0.5;

  const loadingMessages = {
    subtle: 'Softening the edges...',
    human:  'Making it sound human...',
    ceo:    'Stripping it down to nothing...'
  };

  function getMode(val) {
    if (val < 0.33) return 'subtle';
    if (val < 0.67) return 'human';
    return 'ceo';
  }

  function updateSlider(val) {
    sliderValue = Math.max(0, Math.min(1, val));
    const pct = sliderValue * 100;

    thumb.style.left = pct + '%';
    fill.style.width = pct + '%';

    const mode = getMode(sliderValue);

    // Labels
    ['subtle','human','ceo'].forEach(m => {
      document.getElementById('label-' + m).classList.toggle('active', m === mode);
    });

    // Badge
    badge.textContent = mode.charAt(0).toUpperCase() + mode.slice(1);
    badge.className = 'mode-badge ' + mode;
  }

  // Set initial position (human = 50%)
  updateSlider(0.5);

  // Drag logic
  let dragging = false;

  thumb.addEventListener('mousedown', () => dragging = true);
  thumb.addEventListener('touchstart', () => dragging = true, { passive: true });

  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const rect = track.getBoundingClientRect();
    updateSlider((e.clientX - rect.left) / rect.width);
  });

  document.addEventListener('touchmove', e => {
    if (!dragging) return;
    const rect = track.getBoundingClientRect();
    updateSlider((e.touches[0].clientX - rect.left) / rect.width);
  }, { passive: true });

  document.addEventListener('mouseup',  () => dragging = false);
  document.addEventListener('touchend', () => dragging = false);

  track.addEventListener('click', e => {
    const rect = track.getBoundingClientRect();
    updateSlider((e.clientX - rect.left) / rect.width);
  });

  // ── DIFF HIGHLIGHT ──────────────────────────────────
  // Compares original and rewritten word by word
  // Returns HTML with changed words wrapped in highlight spans
  function buildHighlightedHTML(original, rewritten, mode) {
    const origWords = original.trim().split(/\s+/);
    const newWords  = rewritten.trim().split(/\s+/);

    // Simple LCS-based diff
    const m = origWords.length;
    const n = newWords.length;

    // Build LCS table (capped at 300 words for performance)
    const cap = 300;
    const om = Math.min(m, cap);
    const nm = Math.min(n, cap);
    const dp = Array.from({length: om + 1}, () => new Array(nm + 1).fill(0));

    for (let i = 1; i <= om; i++) {
      for (let j = 1; j <= nm; j++) {
        if (origWords[i-1].toLowerCase().replace(/[^a-z0-9]/g,'') ===
            newWords[j-1].toLowerCase().replace(/[^a-z0-9]/g,'')) {
          dp[i][j] = dp[i-1][j-1] + 1;
        } else {
          dp[i][j] = Math.max(dp[i-1][j], dp[i][j-1]);
        }
      }
    }

    // Backtrack to find which new words are "same" vs "changed"
    const inLCS = new Array(Math.min(n, cap)).fill(false);
    let i = om, j = nm;
    while (i > 0 && j > 0) {
      const ow = origWords[i-1].toLowerCase().replace(/[^a-z0-9]/g,'');
      const nw = newWords[j-1].toLowerCase().replace(/[^a-z0-9]/g,'');
      if (ow === nw) {
        inLCS[j-1] = true;
        i--; j--;
      } else if (dp[i-1][j] > dp[i][j-1]) {
        i--;
      } else {
        j--;
      }
    }

    const hlClass = mode === 'ceo' ? 'highlight-ceo' : 'highlight';

    const htmlParts = newWords.map((word, idx) => {
      const changed = idx < cap ? !inLCS[idx] : true;
      if (changed) {
        return `<span class="${hlClass}">${escapeHTML(word)}</span>`;
      }
      return escapeHTML(word);
    });

    return htmlParts.join(' ');
  }

  function escapeHTML(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  // ── HUMANIZE ────────────────────────────────────────
  let lastOriginal = '';

  async function humanize() {
    const text = document.getElementById('inputText').value.trim();
    const errorBox = document.getElementById('errorBox');
    const btn = document.getElementById('humanizeBtn');
    const mode = getMode(sliderValue);

    errorBox.style.display = 'none';

    if (!text) {
      errorBox.textContent = 'Please paste an email first.';
      errorBox.style.display = 'block';
      return;
    }

    if (text.length < 20) {
      errorBox.textContent = 'Paste a full email for best results.';
      errorBox.style.display = 'block';
      return;
    }

    lastOriginal = text;

    btn.disabled = true;
    btn.textContent = 'Working...';
    document.getElementById('loadingMsg').textContent = loadingMessages[mode];
    document.getElementById('loadingWrap').style.display = 'block';
    document.getElementById('results').style.display = 'none';

    try {
      const response = await fetch('/api/humanize', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, mode })
      });

      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Something went wrong');

      // Strip "Sent from my iPhone" from rewritten if CEO mode (we render it separately)
      let rewritten = data.rewritten;
      let showIphone = false;

      if (mode === 'ceo') {
        rewritten = rewritten.replace(/\n?sent from my iphone\.?/gi, '').trim();
        showIphone = true;
      }

      // Highlighted output
      const highlighted = buildHighlightedHTML(lastOriginal, rewritten, mode);
      document.getElementById('rewrittenText').innerHTML = highlighted;
      document.getElementById('iphoneFooter').style.display = showIphone ? 'block' : 'none';

      // Changes list
      const changesList = document.getElementById('changesList');
      changesList.innerHTML = '';
      const lines = (data.changes || '').split('\n').filter(l => l.trim().length > 0);
      lines.forEach(line => {
        const li = document.createElement('li');
        li.textContent = line.replace(/^[-•*]\s*/, '').trim();
        changesList.appendChild(li);
      });

      document.getElementById('loadingWrap').style.display = 'none';
      document.getElementById('results').style.display = 'block';
      document.getElementById('results').scrollIntoView({ behavior: 'smooth', block: 'start' });

    } catch (err) {
      document.getElementById('loadingWrap').style.display = 'none';
      errorBox.textContent = '⚠️ ' + err.message;
      errorBox.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Humanize it →';
    }
  }

  function copyText() {
    const text = document.getElementById('rewrittenText').innerText;
    const footer = document.getElementById('iphoneFooter');
    const full = footer.style.display !== 'none'
      ? text + '\n\nSent from my iPhone'
      : text;

    navigator.clipboard.writeText(full).then(() => {
      const btn = document.getElementById('copyBtn');
      btn.textContent = 'Copied!';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
    });
  }

  function reset() {
    document.getElementById('results').style.display = 'none';
    document.getElementById('inputText').value = '';
    document.getElementById('humanizeBtn').disabled = false;
    document.getElementById('humanizeBtn').textContent = 'Humanize it →';
    document.getElementById('errorBox').style.display = 'none';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
</script>

</body>
</html>
